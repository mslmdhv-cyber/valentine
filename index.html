<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Be My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #fff1f7);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card {
    background: white;
    width: 90%;
    max-width: 360px;
    padding: 32px 24px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    animation: fadeUp 1.2s ease forwards;
  }

  h2 {
    font-size: 22px;
    margin-bottom: 16px;
  }

  p {
    font-size: 15px;
    line-height: 1.6;
    color: #444;
  }

  .tap {
    margin-top: 22px;
    padding: 12px 18px;
    border-radius: 25px;
    background: #ff5c8a;
    color: white;
    font-weight: 600;
    display: inline-block;
    cursor: pointer;
    animation: pulse 1.6s infinite;
  }

  .hidden {
    display: none;
    margin-top: 22px;
    animation: fadeUp 1s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .heart {
    position: absolute;
    bottom: -20px;
    font-size: 18px;
    animation: floatUp linear forwards;
    opacity: 0.8;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
  }
</style>
</head>

<body>

<div class="card">
  <h2>Yes detected 💖</h2>

  <p>
    Squared with your Poco for the 4th year ✨
  </p>

  <div class="tap" onclick="reveal()">Tap here 💕</div>

  <div class="hidden" id="message">
    <p>
      This Valentine’s Day comes with a promise —<br>
      more love, more patience,<br>
      and a Poco growing into the best version of himself,<br>
      for himself and for you ♥️
    </p>

    <p>
      Happy Valentine’s Day, Poco 🌸♥️<br>
      I love you the mostest 💜
    </p>
  </div>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/02/23/audio_09c2e57a7d.mp3" type="audio/mpeg">
</audio>

<script>
  let started = false;

  function reveal() {
    document.getElementById("message").style.display = "block";

    if (!started) {
      document.getElementById("music").play();
      started = true;
    }
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
  }

  setInterval(createHeart, 400);
</script>

</body>
</html>
