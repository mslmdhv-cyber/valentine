<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 360px;
      padding: 32px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }

    h2 {
      font-size: 22px;
      margin-bottom: 28px;
      color: #333;
    }

    .buttons {
      position: relative;
      height: 80px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      margin-right: 12px;
    }

    #no {
      background: #eaeaea;
      position: absolute;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Will you be my Valentine? 💖</h2>

    <div class="buttons">
      <button id="yes" onclick="yesClicked()">Yes</button>
      <button id="no" onmouseover="moveNo()">No</button>
    </div>
  </div>

  <script>
    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 60 - 30;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:linear-gradient(135deg,#ffd6e8,#ffeef6);
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        ">
          <div style="
            background:white;
            padding:32px 26px;
            border-radius:20px;
            max-width:380px;
            text-align:center;
            box-shadow:0 20px 40px rgba(0,0,0,0.12);
            font-size:16px;
            line-height:1.6;
          ">
            Yes detected 💖<br><br>
            Squared with your Poco for the <b>4th year</b> ✨<br><br>
            This Valentine’s Day comes with a promise —<br>
            more love, more patience,<br>
            and a Poco growing into the best version of himself,<br>
            for himself and for you ♥️<br><br>
            Happy Valentine’s Day, <b>Poco</b> 🌸♥️<br><br>
            <i>I love you the mostest</i> 💜
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
